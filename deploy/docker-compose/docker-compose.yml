version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: social
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile
      args:
        SERVICE: migrate
    environment:
      SOCIALD_CONFIG: /app/configs/sociald.yaml
    depends_on:
      - postgres
    restart: "no"

  sociald:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile
      args:
        SERVICE: sociald
    environment:
      SOCIALD_CONFIG: /app/configs/sociald.yaml
    depends_on:
      - postgres
      - redis
    ports:
      - "8081:8081"

  riskd:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile
      args:
        SERVICE: riskd
    environment:
      RISKD_CONFIG: /app/configs/riskd.yaml
    depends_on:
      - redis
    ports:
      - "8082:8082"

  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile
      args:
        SERVICE: gateway
    environment:
      GATEWAY_CONFIG: /app/configs/gateway.yaml
    depends_on:
      - riskd
      - sociald
      - redis
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../../configs/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"

  otel-collector:
    image: otel/opentelemetry-collector:0.96.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ../../configs/otel-collector.yaml:/etc/otel-collector.yaml
    ports:
      - "4317:4317"

volumes:
  pgdata:
