<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Post</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
  <main class="max-w-3xl mx-auto px-6 py-8">
    <article class="bg-white p-6 rounded-xl shadow">
      <div class="flex items-center justify-between">
        <a href="/u/{{.Post.Username}}" class="font-semibold">@{{.Post.Username}}</a>
        <span class="text-xs text-slate-400">{{.Post.CreatedAt.Format "02 Jan 15:04"}}</span>
      </div>
      <p class="mt-3 text-slate-700">{{.Post.Content}}</p>
    </article>
    <section class="mt-6 bg-white p-6 rounded-xl shadow">
      <h2 class="font-semibold">Comments</h2>
      <div class="space-y-3 mt-4">
        {{range .Comments}}
        <div class="border-b pb-2">
          <div class="text-sm text-slate-500">@{{.Username}} • {{.CreatedAt.Format "02 Jan 15:04"}}</div>
          <div class="text-slate-700">{{.Content}}</div>
        </div>
        {{end}}
      </div>
      {{if .User}}
      <form method="POST" action="/api/posts/{{.Post.ID}}/comments" class="mt-4 space-y-2">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}" />
        <textarea name="content" class="w-full border rounded-lg p-2" rows="3" placeholder="Add comment"></textarea>
        <button class="bg-indigo-600 text-white px-4 py-2 rounded-lg">Comment</button>
      </form>
      {{end}}
    </section>
  </main>
</body>
</html>
