<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Users</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
  <main class="max-w-5xl mx-auto px-6 py-8">
    <h1 class="text-xl font-semibold mb-4">Users</h1>
    <table class="w-full bg-white rounded-xl shadow">
      <thead class="text-left text-sm text-slate-500">
        <tr>
          <th class="p-3">ID</th>
          <th class="p-3">Email</th>
          <th class="p-3">Role</th>
          <th class="p-3">Status</th>
          <th class="p-3">Actions</th>
        </tr>
      </thead>
      <tbody>
        {{range .Users}}
        <tr class="border-t">
          <td class="p-3">{{.ID}}</td>
          <td class="p-3">{{.Email}}</td>
          <td class="p-3">{{.Role}}</td>
          <td class="p-3">{{if .Banned}}Banned{{else}}Active{{end}}</td>
          <td class="p-3">
            <form method="POST" class="inline">
              <input type="hidden" name="csrf_token" value="{{$.CSRF}}" />
              <input type="hidden" name="user_id" value="{{.ID}}" />
              {{if .Banned}}
                <button name="action" value="unban" class="text-sm text-emerald-600">Unban</button>
              {{else}}
                <button name="action" value="ban" class="text-sm text-rose-600">Ban</button>
              {{end}}
              <button name="action" value="promote" class="text-sm text-indigo-600 ml-2">Promote</button>
            </form>
          </td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </main>
</body>
</html>
