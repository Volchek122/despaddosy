<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Security Events</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
  <main class="max-w-5xl mx-auto px-6 py-8">
    <h1 class="text-xl font-semibold mb-4">Security Events</h1>
    <div class="space-y-3">
      {{range .Events}}
      <div class="bg-white p-4 rounded-xl shadow text-sm">
        <div><strong>Decision:</strong> {{.decision}}</div>
        <div><strong>Route:</strong> {{.route_id}} • <strong>Score:</strong> {{.score}}</div>
        <div><strong>Reasons:</strong> {{.reasons}}</div>
      </div>
      {{end}}
    </div>
  </main>
</body>
</html>
