<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Posts</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
  <main class="max-w-5xl mx-auto px-6 py-8">
    <h1 class="text-xl font-semibold mb-4">Posts</h1>
    <div class="space-y-3">
      {{range .Posts}}
      <div class="bg-white p-4 rounded-xl shadow">
        <div class="text-sm text-slate-500">@{{.Username}} • {{.CreatedAt.Format "02 Jan 15:04"}}</div>
        <div class="mt-2">{{.Content}}</div>
        <form method="POST" class="mt-2">
          <input type="hidden" name="csrf_token" value="{{$.CSRF}}" />
          <input type="hidden" name="post_id" value="{{.ID}}" />
          <button name="action" value="hide" class="text-sm text-rose-600">Hide</button>
          <button name="action" value="unhide" class="text-sm text-emerald-600 ml-2">Unhide</button>
        </form>
      </div>
      {{end}}
    </div>
  </main>
</body>
</html>
